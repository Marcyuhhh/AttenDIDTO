name: Deploy Supabase production changes

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: I reviewed the migration and want to apply production database changes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_production }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply reviewed database migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure notification function secrets
        run: >-
          supabase secrets set
          RESEND_API_KEY="$RESEND_API_KEY"
          ADMIN_EMAIL="$ADMIN_EMAIL"
          NOTIFICATION_FROM_EMAIL="$NOTIFICATION_FROM_EMAIL"
          APP_ORIGIN="$APP_ORIGIN"
          --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}

      - name: Deploy payment notification function
        run: supabase functions deploy event-payment-notification --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
